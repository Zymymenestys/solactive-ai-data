name: Update Solactive AI index
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_solactive.py'
      - '.github/workflows/solactive-daily.yml'
  schedule:
    # UTC schedules; Helsinki winter UTC+2, summer UTC+3.
    # Multiple off-hour attempts reduce the risk of a missed scheduled run.
    - cron: '17 4 * * 1-5'
    - cron: '47 4 * * 1-5'
    - cron: '17 5 * * 1-5'
    # 09:00 Helsinki: 06:00 UTC in summer, 07:00 UTC in winter.
    - cron: '0 6 * * 1-5'
    - cron: '0 7 * * 1-5'

permissions:
  contents: write

concurrency:
  group: solactive-index-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check Helsinki 09:00 schedule
        id: timecheck
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && ( "${{ github.event.schedule }}" == "0 6 * * 1-5" || "${{ github.event.schedule }}" == "0 7 * * 1-5" ) ]]; then
            if [[ "$(TZ=Europe/Helsinki date +%H)" != "09" ]]; then
              echo "run_update=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run_update=true" >> "$GITHUB_OUTPUT"
      - name: Checkout
        if: steps.timecheck.outputs.run_update == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        if: steps.timecheck.outputs.run_update == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate history
        if: steps.timecheck.outputs.run_update == 'true'
        run: python scripts/fetch_solactive.py
      - name: Commit updated JSON files
        if: steps.timecheck.outputs.run_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/solactive-*.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update Solactive index history"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict; stopping without overwriting remote changes"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Push successful"
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying"
            sleep 5
          done
          echo "Push failed after 5 attempts"
          exit 1
