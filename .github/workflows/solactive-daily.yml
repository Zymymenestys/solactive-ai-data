name: Update Solactive AI index
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_solactive.py'
      - '.github/workflows/solactive-daily.yml'
  schedule:
    - cron: '13 9 * * 1-5'
      timezone: Europe/Helsinki
    - cron: '37 9 * * 1-5'
      timezone: Europe/Helsinki
    - cron: '51 9 * * 1-5'
      timezone: Europe/Helsinki

permissions:
  contents: write

concurrency:
  group: solactive-index-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate history
        run: python scripts/fetch_solactive.py
      - name: Commit updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/solactive-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Solactive index history"
            git push
          fi
