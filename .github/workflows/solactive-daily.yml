name: Update Solactive AI index
# Automated report refresh: 2026-10-30
# Refresh requested via ChatGPT
# Manual refresh test via workflow-file push
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_solactive.py'
      - '.github/workflows/solactive-daily.yml'

permissions:
  contents: write

concurrency:
  group: solactive-index-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and validate history
        run: python scripts/fetch_solactive.py
      - name: Commit updated JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/solactive-*.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update Solactive index history"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Rebase conflict; stopping without overwriting remote changes"
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Push successful"
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying"
            sleep 5
          done
          echo "Push failed after 5 attempts"
          exit 1

